<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>User Dashboard - CleanMe</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="img/favicon.ico" rel="icon">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400&display=swap" rel="stylesheet">
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="wrapper">
            <div class="header">
                <div class="container-fluid">
                    <div class="header-top row align-items-center">
                        <div class="col-lg-3">
                            <div class="brand">
                                <a href="index.html">CleanMe</a>
                            </div>
                        </div>
                        <div class="col-lg-9">
                            <div class="navbar navbar-expand-lg bg-light navbar-light">
                                <a href="#" class="navbar-brand">MENU</a>
                                <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                                    <span class="navbar-toggler-icon"></span>
                                </button>
                                <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                                    <div class="navbar-nav ml-auto">
                                        <a href="index.html" class="nav-item nav-link">Home</a>
                                        <a href="about.html" class="nav-item nav-link">About</a>
                                        <a href="service.html" class="nav-item nav-link">Service</a>
                                        <a href="portfolio.html" class="nav-item nav-link">Project</a>
                                        <a href="contact.html" class="nav-item nav-link">Contact</a>
                                        <a id="login-link" href="login.html" class="nav-item nav-link">Login</a>
                                        <a id="dashboard-link" href="dashboard.html" class="nav-item nav-link" style="display:none;">Dashboard</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="page-header">
                        <h2>User Dashboard</h2>
                    </div>
                </div>
            </div>
            <div class="contact">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="contact-form login-container">
                                <p id="welcome-message" class="text-center"></p>
                                <div class="form-group">
                                    <label for="booking-date">Choose your cleaning date</label>
                                    <input type="date" id="booking-date" class="form-control" required>
                                </div>
                                <div><button id="book-btn" class="btn btn-block">Book</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="container">
                    <p>&copy; CleanMe</p>
                </div>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
        <script src="login.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const user = localStorage.getItem('loggedInUser');
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('welcome-message').textContent = 'Welcome, ' + user + '!';
                const bookBtn = document.getElementById('book-btn');
                bookBtn.addEventListener('click', function() {
                    const date = document.getElementById('booking-date').value;
                    if (date) {
                        alert('Reservation saved for ' + date);
                    }
                });
            });
        </script>
    </body>
</html>
